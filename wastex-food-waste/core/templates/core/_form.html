{% for field in form %}
<div class="field {% if field.name == 'address' or field.name == 'notes' or field.name == 'message' %}full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
{% if form.non_field_errors %}<div class="field full">{{ form.non_field_errors }}</div>{% endif %}
