{% extends "core/base.html" %}
{% block title %}Login — Wastex{% endblock %}
{% block content %}
<section><div class="wrap">
  <form class="form-card" method="post" style="max-width:460px">{% csrf_token %}
    <h2 style="text-align:center">Welcome back</h2>
    <p class="lead" style="text-align:center;margin:0 auto 1.4rem">Demo account: <b>demo / wastex123</b></p>
    <div class="form-grid" style="grid-template-columns:1fr">{% include "core/_form.html" %}</div>
    <button class="btn" type="submit" style="margin-top:1.3rem;width:100%;justify-content:center">Login →</button>
    <p style="text-align:center;margin-top:1rem">New here? <a href="{% url 'register' %}" style="color:var(--green);font-weight:700">Create an account</a></p>
  </form>
</div></section>
{% endblock %}
